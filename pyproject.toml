[project]
name = "chromatography-viz"
version = "0.1.0"
description = "Streamlit visualization for AKTA Unicorn chromatography data"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.37.0",
    "plotly>=5.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "streamlit-desktop-app>=0.3.4",
]

[dependency-groups]
dev = ["ruff>=0.1.0", "pytest>=7.0.0"]

[tool.pytest.ini_options]
# Make `pytest` work from the repo root (tests import top-level modules like `utils`).
pythonpath = ["."]
testpaths = ["tests"]
